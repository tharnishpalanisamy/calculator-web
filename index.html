<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'><link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet"><link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="calculator">
        <div class="calculator-header d-flex justify-content-end pe-2">
            <i class="bi bi-clock fs-2 clock-icon"></i>
            <i class="bi bi-calculator-fill fs-2 calculator-icon d-none"></i>
        </div>




        <div class="calculatorContainer">
            <div class="calculator-display ">
                <h2 class="user-input text-light mt-3"></h2>
            </div>
            <div class="calculator-buttons">
                <div class="grid-container">    
                    <button type="button" class="top-calculator-btn wrong"><i type="button" class='bx bx-comment-x'></i></button>
                    <button type="button" class="top-calculator-btn clear">AC</button>
                    <button type="button" class="top-calculator-btn operator">%</button>
                    <button type="button" class="operator-btn operator">÷</button> 
                    <button type="button" class="number-btn number">7</button>
                    <button type="button" class="number-btn number">8</button>
                    <button type="button" class="number-btn number">9</button>
                    <button type="button" class="operator-btn operator">x</button>
                    <button type="button" class="number-btn number">4</button>
                    <button type="button" class="number-btn number">5</button>
                    <button type="button" class="number-btn number">6</button>
                    <button type="button" class="operator-btn operator">−</button>
                    <button type="button" class="number-btn number">1</button>
                    <button type="button" class="number-btn number">2</button>
                    <button type="button" class="number-btn number">3</button>
                    <button type="button" class="operator-btn operator">+</button>
                    <button type="button" class="number-btn number">00</button>
                    <button type="button" class="number-btn number">0</button>
                    <button type="button" class="number-btn">.</button>
                    <button type="button" class="operator-btn equal">=</button>

                </div>
            </div>
        </div>


        <div class="historyContainer d-none">
        </div>
    </main>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="app.js"></script>
</body>
</html>
